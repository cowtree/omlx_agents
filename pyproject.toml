[project]
name = "omlx-agents"
version = "0.1.0"
description = "Production AI agent patterns built on open-source LLMs running locally with oMLX"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["structured_output_agent"]
testpaths = ["structured_output_agent/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
